name: Build and Release Firmware

on:
  push:
    tags:
      - 'r*'  # Trigger on tags like r1, r2, r10, etc.

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # PlatformIO core is pinned like everything else: it chooses the dependency
    # resolver and the build pipeline, so floating it floats the firmware.
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install 'platformio==6.1.18'

    - name: Run host-native tests
      run: pio test -e native

    - name: Build firmware (all variants)
      run: |
        echo "Building all hardware variants..."
        pio run -e matrixportal_s3
        pio run -e esp32_s3_n8r2

    # The whole point of pinning platform-espressif32 by release URL is that CI
    # and the dev machine build the same firmware. Until r8 they did not: a clean
    # runner resolved the bare name "espressif32" to platformio/espressif32 7.0.1
    # (Arduino core 2.0.17) while the dev machine used the pioarduino fork
    # (Arduino core 3.3.7). Fail loudly if that ever drifts apart again.
    - name: Verify pinned toolchain
      run: |
        pio pkg list -e matrixportal_s3 2>&1 | tee /tmp/pkgs.txt
        if ! grep -q 'framework-arduinoespressif32 @ 3.3.7' /tmp/pkgs.txt; then
          echo "::error::Expected Arduino core 3.3.7; toolchain resolution has drifted."
          exit 1
        fi

    - name: Get release number from tag
      id: get_version
      run: echo "RELEASE_NUM=${GITHUB_REF#refs/tags/r}" >> $GITHUB_OUTPUT

    - name: List firmware binaries
      run: |
        echo "Built firmware files:"
        ls -lh dist/*.bin

    - name: Extract changelog for this release
      id: changelog
      run: |
        RELEASE_NUM=${{ steps.get_version.outputs.RELEASE_NUM }}
        # Extract section between [rN] header and next [r header (mawk-compatible)
        CHANGELOG=$(awk '/^## \[r'"${RELEASE_NUM}"'\]/{f=1;next} f && /^## \[r[0-9]/{exit} f' CHANGELOG.md)
        # If empty, use default message
        if [ -z "$CHANGELOG" ]; then
          CHANGELOG="See commit history for details."
        fi
        # Save to file to preserve formatting
        echo "$CHANGELOG" > /tmp/release_notes.txt
        echo "NOTES_FILE=/tmp/release_notes.txt" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*.bin
        name: Release ${{ steps.get_version.outputs.RELEASE_NUM }}
        body_path: ${{ steps.changelog.outputs.NOTES_FILE }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
