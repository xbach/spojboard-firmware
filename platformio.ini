; PlatformIO Project Configuration File
; SpojBoard - Smart Panel for Onward Journeys
;
; Multi-Hardware Support: MatrixPortal and ESP32-S3 N8R2

; `pio run` with no -e must not try to build the desktop test env.
[platformio]
default_envs = matrixportal_s3, esp32_s3_n8r2

; ============================================================================
; Common Configuration
; ============================================================================
[common]
; Toolchain and deps are pinned EXACTLY. SpojBoard ships GitHub OTA to customer
; devices, so an unreproducible build is an unreproducible thing already running
; on someone else's hardware -- "check out rN and build" must yield that binary.
;
; platform: `espressif32` as a BARE NAME is not a version, it is a lookup that
; prefers any locally-installed platform of that name and only falls through to
; the registry when there is none. That silently split this project in two: on
; the dev machine (pioarduino fork installed) it built against Arduino core
; 3.3.7, while GitHub Actions -- a clean runner -- resolved
; platformio/espressif32 7.0.1 and shipped Arduino core 2.0.17 to every device
; through r8. Same tag, two firmwares, 18.7KB of static RAM apart. Pinning by
; release URL is what makes the two agree.
;
; 55.03.37 == Arduino core 3.3.7: the core this codebase is actually developed
; and tested against locally, and the one beerboard-fw pins.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip

; Every version below is the one the dev machine already resolved to, recorded
; rather than chosen, so pinning changes no local binary. Ranges (^) are banned
; here: they make the build a function of the date it ran.
lib_deps =
    ; HUB75 LED Matrix Driver. Org is mrcodetastic; `mrfaptastic` is the OLD name
    ; and resolved only via GitHub's rename redirect -- do not rely on it.
    ; (beerboard-fw pins an older commit, 3171232; this is deliberately the one
    ; spojboard has been building and testing against, not beerboard's.)
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#69e3d80cc2f423a218344439d4ea3b244f3d78e7
    ; JSON parsing
    bblanchon/ArduinoJson@6.21.5
    ; Adafruit GFX (required by display library)
    adafruit/Adafruit GFX Library@1.12.4
    ; Adafruit BusIO: a TRANSITIVE dep of GFX, pinned explicitly because an
    ; unpinned transitive floats exactly like a direct one.
    adafruit/Adafruit BusIO@1.17.4
    ; MQTT client
    knolleary/PubSubClient@2.8.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wno-deprecated-declarations

extra_scripts =
    pre:scripts/build_id.py
    post:scripts/post_build.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ============================================================================
; Hardware Variant: Adafruit MatrixPortal ESP32-S3
; ============================================================================
[env:matrixportal_s3]
platform = ${common.platform}
board = adafruit_matrixportal_esp32s3
framework = arduino

; Memory optimization - Custom OTA partitions (2MB app0 + 2MB app1)
board_build.partitions = partitions_custom.csv

; Inherit common settings
lib_deps = ${common.lib_deps}
extra_scripts = ${common.extra_scripts}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}

; Hardware variant identification
build_flags =
    ${common.build_flags}
    -DHARDWARE_VARIANT=1
    -DHARDWARE_NAME=\"matrixportal_s3\"
    -DHARDWARE_DISPLAY_NAME=\"MatrixPortal-S3\"

; Variant metadata (used by build scripts)
custom_hardware_variant = matrixportal_s3

; Upload settings
upload_speed = 921600

; ----------------------------------------------------------------------------
; Display geometry variants for the MatrixPortal (TA-0269 §3)
; ----------------------------------------------------------------------------
; The base env above IS the 2x32 build and keeps emitting the BARE asset name
; (spojboard-matrixportal_s3-r<N>-<sha>.bin), unchanged from every release so
; far. `pio run -e matrixportal_s3` therefore still builds exactly what it built
; before this task; only these two envs are new.
;
; `custom_display_variant` is what post_build.py turns into the <display> field
; of the asset name. It is deliberately ABSENT on the base env: an asset with no
; display field is the legacy/bare form, and r9's parser classifies it as Bare
; rather than rejecting it.
;
; VARIANT_NAME stays the BARE BOARD ("matrixportal_s3") in all three. r9's asset
; grammar splits board and display into separate dash-delimited fields, so the
; composite VARIANT_NAME that §3 originally specified is superseded -- the board
; matcher must keep seeing just the board.

[env:matrixportal_s3_4x32]
extends = env:matrixportal_s3
build_flags = ${env:matrixportal_s3.build_flags} -DDISPLAY_VARIANT=2
custom_display_variant = 4x32

[env:matrixportal_s3_2x64]
extends = env:matrixportal_s3
build_flags = ${env:matrixportal_s3.build_flags} -DDISPLAY_VARIANT=3
custom_display_variant = 2x64

; ============================================================================
; Hardware Variant: Generic ESP32-S3 N8R2 (8MB Flash, 2MB PSRAM)
; ============================================================================
[env:esp32_s3_n8r2]
platform = ${common.platform}
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
; N8R2 = 8MB quad flash + 2MB *quad* (QSPI) PSRAM. Octal (opi) is for R8 parts
; (e.g. N16R8); using it on a quad chip fails PSRAM init at boot.
;
; CAVEAT -- this line does not do what its name suggests, and never has. Stock
; `esp32-s3-devkitc-1` is the N8 board def: it declares no PSRAM, so nothing
; defines BOARD_HAS_PSRAM and PSRAM stays OFF no matter what psram_type says.
; Both platforms print the board as "(8 MB QD, No PSRAM)". Left in place because
; it is harmless and correct for the day a real N8R2 board def is used: SpojBoard
; deliberately allocates nothing from PSRAM (the 128x64 build buys its headroom
; by dropping HUB75 color depth to 5 bits instead -- the PSRAM route bootlooped
; and was reverted, c44309e). Expect MEM@ lines to report PSRAM=0 here.
board_build.psram_type = qspi
board_upload.flash_size = 8MB
framework = arduino

; Memory optimization - Custom OTA partitions (2MB app0 + 2MB app1)
board_build.partitions = partitions_custom.csv

; Inherit common settings
lib_deps = ${common.lib_deps}
extra_scripts = ${common.extra_scripts}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}

; Hardware variant identification
build_flags =
    ${common.build_flags}
    -DHARDWARE_VARIANT=2
    -DHARDWARE_NAME=\"esp32_s3_n8r2\"
    -DHARDWARE_DISPLAY_NAME=\"ESP32-S3-N8R2\"

; Variant metadata (used by build scripts)
custom_hardware_variant = esp32_s3_n8r2

; Upload settings
upload_speed = 921600

; ============================================================================
; Host-native test environment (desktop, no hardware).
; Runs pure-logic suites under test/ with `pio test -e native`.
; ============================================================================
[env:native]
platform = native
test_framework = unity
; Unity floats to whatever the registry serves otherwise -- same trap as the
; firmware deps, and a test harness that changes under you is worse than none.
lib_deps =
    throwtheswitch/Unity@2.6.1
    ; ArduinoJson is header-only and builds on the desktop, so the GitHub-release
    ; parse path is testable natively (test_otajson).
    bblanchon/ArduinoJson@6.21.5
build_flags = -std=gnu++17 -DUNIT_TEST
